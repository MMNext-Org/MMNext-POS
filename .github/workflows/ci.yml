name: MMNextPOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_CONFIGURATION: Release
  SOLUTION_FILE: MMNextPOS.slnx

permissions:
  contents: read
  pull-requests: read
  issues: read
  discussions: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build + Format + Application unit tests
  # Windows runner is required because the solution includes MMNextPOS.WinForms
  # (net8.0-windows + DevExpress). No Docker needed for this job.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-unit-tests:
    name: Build & Unit Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DEVEXPRESS_LICENSE_KEY: "evaluation"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build (Release)
        shell: pwsh
        run: |
          $null = New-Item -ItemType Directory -Force -Path "$env:APPDATA\DevExpress"
          Set-Content -Path "$env:APPDATA\DevExpress\DevExpress_License.txt" -Value "evaluation"
          dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.DOTNET_CONFIGURATION }} --no-restore -p:DevExpressLicenseKey=evaluation

      - name: Format check
        run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes

      # Full unit-test gate — no filters, no exclusions. (An earlier revision
      # kept ExpiryManagementServiceTests in a separate non-blocking step due
      # to 3 pre-existing failures; those have since been fixed and the suite
      # runs clean, so the workaround was removed.)
      - name: Unit tests — Application layer
        run: >
          dotnet test tests/MMNextPOS.Application.Tests/MMNextPOS.Application.Tests.csproj
          --configuration ${{ env.DOTNET_CONFIGURATION }} --no-build
          --logger "trx;LogFileName=application-tests.trx"
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory tests/MMNextPOS.Application.Tests/TestResults

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      # Coverage is collected via the coverlet.collector package already
      # referenced by the test project (see coverlet.runsettings at the repo
      # root), producing Cobertura XML identical to a local developer run.
      - name: Upload coverage artifact (unit tests)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-csharp-unit
          path: tests/MMNextPOS.Application.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Infrastructure integration tests (Testcontainers + MySQL 8.0)
  #
  # These tests spin up throwaway MySQL containers via Testcontainers, so the
  # runner MUST have a Docker daemon. GitHub's ubuntu-latest runners ship with
  # Docker pre-installed and running; windows-latest runners do NOT (and Linux
  # service containers are not supported there either), which is why this job
  # runs on Linux. Only the test project graph is built (Domain → Infrastructure
  # → Application, all net8.0, no WinForms dependency), so Linux is sufficient.
  # ─────────────────────────────────────────────────────────────────────────────
  infrastructure-tests:
    name: Infrastructure Tests (Ubuntu + Docker Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify Docker daemon
        run: docker info

      # Testcontainers pulls mysql:8.0 on demand. Pull it up-front with a few
      # retries to absorb transient Docker Hub rate-limit failures, and fail
      # fast with a clear message instead of a confusing mid-test timeout.
      - name: Pre-pull MySQL 8.0 image (with retries)
        run: |
          for attempt in 1 2 3; do
            echo "Pull attempt $attempt/3..."
            if docker pull mysql:8.0; then
              echo "mysql:8.0 pulled successfully."
              exit 0
            fi
            echo "Pull failed — waiting 15s before retrying."
            sleep 15
          done
          echo "::error::Failed to pull mysql:8.0 after 3 attempts (Docker Hub rate limit or network issue)."
          exit 1

      - name: Build test project graph (Release)
        run: >
          dotnet build tests/MMNextPOS.Infrastructure.Tests/MMNextPOS.Infrastructure.Tests.csproj
          --configuration ${{ env.DOTNET_CONFIGURATION }}

      # Runs the full infrastructure suite: MigrationIdempotenceTests (000-017
      # chain), Sales/Purchase integration tests incl. concurrency scenarios
      # (shared MySqlContainerFixture), StarmanIntegrationTests, and
      # UnitOfWorkTests (own container). No connection string env var is set:
      # the fixture and UnitOfWorkTests both provision throwaway MySQL
      # containers through Testcontainers — the exact same code path used
      # locally with Docker.
      - name: Infrastructure tests (Testcontainers MySQL 8.0)
        run: >
          dotnet test tests/MMNextPOS.Infrastructure.Tests/MMNextPOS.Infrastructure.Tests.csproj
          --configuration ${{ env.DOTNET_CONFIGURATION }} --no-build
          --logger "trx;LogFileName=infrastructure-tests.trx"
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory tests/MMNextPOS.Infrastructure.Tests/TestResults

      - name: Upload test results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      # Coverage is collected via the coverlet.collector package already
      # referenced by the test project (see coverlet.runsettings at the repo
      # root), producing Cobertura XML identical to a local developer run.
      - name: Upload coverage artifact (infrastructure tests)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-csharp-integration
          path: tests/MMNextPOS.Infrastructure.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Coverage upload jobs
  #
  # Run in a separate job from the test suites so the elevated
  # `code-quality: write` permission needed by actions/upload-code-coverage
  # is never held by jobs that execute repository/third-party test code.
  # The `needs.*.result` check allows either "success" or "failure": the
  # coverage artifact is produced by a step with `if: always()`, so it
  # exists even when an individual test fails (e.g. a pre-existing failing
  # test), and the task is to report coverage, not to gate on green tests.
  # Fork PRs are skipped because the upload needs a write token that forked
  # PR runs don't have.
  # ─────────────────────────────────────────────────────────────────────────────
  upload-coverage-csharp-unit:
    name: Upload Coverage (C# unit tests)
    needs: build-and-unit-tests
    if: ${{ !cancelled() && contains(fromJSON('["success", "failure"]'), needs.build-and-unit-tests.result) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-csharp-unit

      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.cobertura.xml
          language: C#
          label: code-coverage-agent

  upload-coverage-csharp-integration:
    name: Upload Coverage (C# integration tests)
    needs: infrastructure-tests
    if: ${{ !cancelled() && contains(fromJSON('["success", "failure"]'), needs.infrastructure-tests.result) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-csharp-integration

      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.cobertura.xml
          language: C#
          label: code-coverage-agent
