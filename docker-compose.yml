version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mmnextpos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: testpassword
      MYSQL_DATABASE: mmnextpos_test
      MYSQL_USER: mmnextpos
      MYSQL_PASSWORD: testpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptestpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mmnextpos-network

  # Optional: phpMyAdmin for database inspection
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: mmnextpos-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: testpassword
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mmnextpos-network

  # Optional: Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mmnextpos-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - mmnextpos-network

networks:
  mmnextpos-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local