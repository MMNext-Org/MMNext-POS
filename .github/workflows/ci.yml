name: MMNextPOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: windows-latest   # WinForms requires Windows
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mmnextpos_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MMNextPOS.slnx

      - name: Build
        run: dotnet build MMNextPOS.slnx --configuration Release --no-restore

      - name: Unit test (Application layer)
        run: dotnet test tests/MMNextPOS.Application.Tests/MMNextPOS.Application.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Integration test (Infrastructure layer)
        env:
          MMNEXTPOS_CONNECTION_STRING: Server=localhost;Port=3306;Database=mmnextpos_test;User ID=test;Password=test;Pooling=true;
        run: dotnet test tests/MMNextPOS.Infrastructure.Tests/MMNextPOS.Infrastructure.Tests.csproj --configuration Release --no-build --verbosity normal
